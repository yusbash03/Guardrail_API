# Render Blueprint (ADR-020). Field names follow DEPLOYMENT_GUIDE.md §3.1 — [VERIFY] against current Render docs before first sync.
# Secrets (ConnectionStrings__Default, Jwt__SigningKey, PayPal__ClientId/ClientSecret/WebhookId, Llm__*__ApiKey,
# Jobs__InternalToken) live only in the guardrail-secrets env group, never in git. A local, git-ignored .env.render
# holds them for pasting into the group ("Add from .env").
# Database: Neon (free). ConnectionStrings__Default is Neon's *pooled* URL (postgresql://…-pooler…?sslmode=require);
# the app accepts the URL form directly.
services:
  - type: web
    name: guardrail-api
    # Without an explicit plan a Blueprint creates a paid instance. Free sleeps after ~15 min idle (slow first request).
    plan: free
    runtime: docker
    # Relative to the git repo root (Guardrail_API), which holds this project under "guardrail-ai 2/".
    rootDir: "guardrail-ai 2/backend"
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: guardrail-secrets
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Migrations are a separate step (ADR-014), run against Neon's *direct* (non-pooler) endpoint:
      #   ConnectionStrings__Default='<direct URL>' dotnet ef database update \
      #     --project src/Guardrail.Infrastructure --startup-project src/Guardrail.Infrastructure
      - key: Database__MigrateOnStartup
        value: "false"
      # Hackathon demo: publish interactive API docs (/scalar, /swagger) in Production. Set "false" to hide them.
      - key: ApiDocs__Enabled
        value: "true"
      - key: PayPal__BaseUrl
        value: https://api-m.sandbox.paypal.com
      - key: PayPal__Intent
        value: AUTHORIZE
      - key: Llm__Primary__BaseUrl
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # Flash-Lite: verified 2026-11-02 with tool calls; gemini-3.5-flash's free tier is only 20 requests/day.
      - key: Llm__Primary__Model
        value: gemini-3.5-flash-lite
      - key: Llm__Fallback__BaseUrl
        value: https://api.groq.com/openai/v1
      - key: Llm__Fallback__Model
        value: openai/gpt-oss-120b
  # No Render Cron Job: cron jobs are paid on Render. The same jobs (approval/checkout expiry, webhook processing,
  # payment reconciliation) run inside the API as background services while it is awake. For a paid setup, a cron
  # can POST /api/v1/internal/jobs/run with header X-Job-Token: <Jobs__InternalToken> every 10 minutes.
envVarGroups:
  - name: guardrail-secrets
    envVars: []   # values are pasted in the dashboard from .env.render, never committed
